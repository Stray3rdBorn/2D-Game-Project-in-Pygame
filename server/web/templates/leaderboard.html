{% extends "base.html" %} {% block content %}
<h1>Top 10</h1>
<table border="1" cellpadding="6">
  <tr>
    <th>Rank</th>
    <th>Player</th>
    <th>Best score</th>
  </tr>
  {% for s in scores %}
  <tr>
    <td>{{ forloop.counter }}</td>
    <td>{{ s.player_name }}</td>
    <td>{{ s.best }}</td>
  </tr>
  {% empty %}
  <tr>
    <td colspan="3">No scores yet.</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
