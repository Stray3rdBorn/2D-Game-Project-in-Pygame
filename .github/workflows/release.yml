name: Release

# runs only when I push a tag like v1.0.0
on:
  push:
    tags:
      - "v*"

# the release job needs to create a release, nothing else
permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          pip install pyinstaller==6.22.3

      # the exe is only built if the game tests pass
      - name: Run game tests
        run: pytest
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy

      # the online server address comes from a repo variable, never from the code
      - name: Set the server address
        shell: bash
        env:
          ARENA_API_URL: ${{ vars.ARENA_API_URL }}
        run: |
          if [ -z "$ARENA_API_URL" ]; then echo "Repo variable ARENA_API_URL is not set"; exit 1; fi
          printf 'API_URL = "%s"\n' "$ARENA_API_URL" > client/server_address.py

      - name: Build the exe
        run: pyinstaller --onefile --windowed --name DecaDome --paths client --add-data "client/assets;assets" client/app.py

      # start the exe for a few seconds, it must still be running
      - name: Smoke test the exe
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process -FilePath dist/DecaDome.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "The exe closed by itself" }
          Stop-Process -Id $p.Id

      - name: Write the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/DecaDome.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  DecaDome.exe" | Out-File -Encoding ascii dist/DecaDome.exe.sha256

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/DecaDome.exe dist/DecaDome.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
