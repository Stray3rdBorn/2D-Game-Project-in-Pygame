name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the repository
permissions:
  contents: read

# A newer push cancels the older run on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game:
    name: Game tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      # Run Pygame without a real screen or sound card
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest flake8

      - name: Lint for syntax errors and undefined names
        run: flake8 client tests --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style report (does not fail the build)
        run: flake8 client tests --max-line-length=120 --exit-zero --statistics

      - name: Run tests
        run: pytest -v

  server:
    name: Server tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt flake8

      - name: Lint for syntax errors and undefined names
        run: flake8 server --select=E9,F63,F7,F82 --show-source --statistics --exclude=server/venv

      - name: Run tests
        working-directory: server
        run: python -m pytest -v

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check the compose file
        run: docker compose config -q

      - name: Build and start the stack
        run: docker compose up --build -d

      - name: Wait for the API and check it
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/leaderboard
          curl -fsS -o /dev/null http://localhost:8000/admin/login/

      - name: Register, log in, submit a score and read the rank
        run: |
          curl -fsS -X POST http://localhost:8000/api/register -d '{"username":"smoke","password":"a-strong-pass-77"}'
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/login -d '{"username":"smoke","password":"a-strong-pass-77"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST http://localhost:8000/scores -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{"score":500,"wave_reached":2,"won":false}'
          curl -fsS http://localhost:8000/me -H "Authorization: Bearer $TOKEN" | grep '"rank":1'

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v
